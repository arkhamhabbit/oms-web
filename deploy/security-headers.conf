# Included in every location, because nginx drops server-level add_header lines in a
# location that sets its own. HTTPS (and Strict-Transport-Security) belongs to the front web server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
include /etc/nginx/oms/csp.conf;
