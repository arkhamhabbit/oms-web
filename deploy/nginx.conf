server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health: answers 200 without touching the OMS.
    location = /healthz {
        include /etc/nginx/oms/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Written at container start from the environment; never cached.
    location = /config.js {
        include /etc/nginx/oms/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    # Hashed file names: cached for a year; a missing one is a 404, not the app.
    location /assets/ {
        include /etc/nginx/oms/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts and icons keep their names, so a day only.
    location ~ ^/(fonts/|favicon) {
        include /etc/nginx/oms/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Every other path is a client-side route: serve the app (deep link and refresh).
    location / {
        include /etc/nginx/oms/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
}
